services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - pdfai_data:/app/data
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-100mb}

volumes:
  pdfai_data:
