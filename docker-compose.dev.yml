services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - pdfai_data:/app/data
    environment:
      - NODE_ENV=development
    command: npm run dev

volumes:
  pdfai_data:
